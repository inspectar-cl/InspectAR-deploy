services:
  # API Gateway
  apigateway:
    build: ./apigateway
    container_name: apigateway
    ports:
      - "3500:3500"
    env_file:
      - ./apigateway/.env
    
  # Microservicio
  iot-service:
    build:
      context: ./microservicios/ParserService
      dockerfile: Dockerfile
    container_name: iot-service
    ports:
      - "8090:8090"
    depends_on:
      - mongu
      - influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure

  # Base de datos PostgreSQL para documentación
  documentacion-db:
    build:
      context: ./database/documentacion
      dockerfile: Dockerfile
    container_name: documentacion-db
    ports:
      - "5434:5432"  # Puerto diferente para evitar conflicto
    volumes:
      - documentacion_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=documentacion_user
      - POSTGRES_PASSWORD=documentacion_pass
      - POSTGRES_DB=documentacion_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documentacion_user -d documentacion_db"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Base de datos PostgreSQL para gestión
  gestion-db:
    build:
      context: ./database/gestion
      dockerfile: Dockerfile
    container_name: gestion-db
    ports:
      - "5433:5432"
    volumes:
      - gestion_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gestion_user
      - POSTGRES_PASSWORD=gestion_pass
      - POSTGRES_DB=gestion_db
    restart: on-failure

  # Base de datos PostgreSQL para notificaciones
  notification-db:
    build:
      context: ./database/notification
      dockerfile: Dockerfile
    container_name: notification-db
    ports:
      - "5432:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=notification_user
      - POSTGRES_PASSWORD=notification_pass
      - POSTGRES_DB=notification_db

  # Base de datos PostgreSQL para IA/ML
  ia-db:
    build:
      context: ./database/ia
      dockerfile: Dockerfile
    container_name: ia-db
    ports:
      - "5436:5432"
    volumes:
      - ia_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ia_user
      - POSTGRES_PASSWORD=ia_pass
      - POSTGRES_DB=ia_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia_user -d ia_db"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  # Motor ML Python para detección de anomalías
  ml_engine_python:
    build:
      context: ./microservicios/ml_engine_python
      dockerfile: DockerFile
    container_name: ml_engine_python
    ports:
      - "8085:9999"
    environment:
      - HTM_WINDOW_SIZE=180
      - HTM_ALPHA=0.01
      - HTM_K_ADAPT=2.0
      - HTM_SCORE_SCALE=50.0
      - HTM_MIN_PERIODS=50
      - HTM_ROLLING_WINDOW=300
      - HTM_MODE=offline
      - LOG_LEVEL=INFO
      - API_PORT=9999
      - RANDOM_SEED=42
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure

  # Microservicio de IA/ML para detección de anomalías
  ia-service:
    build:
      context: ./microservicios/ia-service
      dockerfile: Dockerfile
    container_name: ia-service
    ports:
      - "8095:8095"
    depends_on:
      - ia-db
      - iot-service
      - ml_engine_python
    environment:
      - CONFIG_FILE=config.docker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8095/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure

  # Microservicio de Notificaciones
  notification-service:
    build:
      context: ./microservicios/notification
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8091:8091"
    depends_on:
      - notification-db
    env_file:
      - ./microservicios/notification/.env
    environment:
      - ENV=production
    restart: on-failure

  # Microservicio de Gestión de Activos y Técnicos
  gestion-service:
    build:
      context: ./microservicios/gestion
      dockerfile: Dockerfile
    container_name: gestion-service
    ports:
      - "8092:8092"
    depends_on:
      - gestion-db
    volumes:
      - ./database/gestion/firmas_iniciales:/docker-entrypoint-initdb.d/firmas_iniciales:ro
      - gestion_firmas:/app/storage/firmas
    environment:
      - PARSER_URL=http://iot-service:8090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure

  # Microservicio de Documentación
  documentacion-service:
    build:
      context: ./microservicios/documentacion
      dockerfile: Dockerfile
    container_name: documentacion-service
    ports:
      - "8093:8093"
    depends_on:
      documentacion-db:
        condition: service_healthy
    environment:
      - GIN_MODE=release
      - PORT=8093
      - CONFIG_FILE=config.docker
      - DOC_DATABASE_HOST=documentacion-db
      - DOC_DATABASE_PORT=5432
      - DOC_DATABASE_USER=documentacion_user
      - DOC_DATABASE_PASSWORD=documentacion_pass
      - DOC_DATABASE_NAME=documentacion_db
      - DOC_DATABASE_SSLMODE=disable
      - DOC_GEMINI_API_KEY=AIzaSyApWlRAMlvyvUUE_9_6tYuMFXn2eL-52gA
      - DOC_GEMINI_PROJECT_ID=My First Project
    volumes:
      - ./microservicios/documentacion/config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8093/health || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: on-failure

  oauth2:
    image: oauth2
    container_name: oauth2
    build:
      context: ./microservicios/oauth2
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    depends_on:
      - database1
    restart: on-failure

  database1:
    container_name: oauth2DB
    build:
      context: ./database/oauth2
      dockerfile: Dockerfile
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: joytan
      POSTGRES_DB: db-oauth
    volumes:
      - pgdata1:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # WebSocket MQTT
      - "8081:8081"    # Dashboard HTTP API
      - "18083:18083"  # EMQX Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_LOADED_PLUGINS=emqx_management,emqx_recon,emqx_retainer,emqx_dashboard,emqx_rule_engine,emqx_bridge_rabbitmq
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s

  # middleware MQTT
  middleware_mqtt:
    build:
      context: ./middleware_MQTT_api
      dockerfile: Dockerfile
    container_name: middleware_mqtt
    depends_on:
      emqx:
        condition: service_healthy
      iot-service:
        condition: service_started
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensor/datos
    restart: on-failure

  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   ports:
  #     - "5672:5672"    # RabbitMQ protocolo AMQP
  #     - "15672:15672"  # RabbitMQ Dashboard
  #   environment:
  #     - RABBITMQ_DEFAULT_USER=admin
  #     - RABBITMQ_DEFAULT_PASS=admin
    

  mongu:
    image: mongo:latest
    container_name: mongu
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      - INFLUXDB_BUCKET=sensores
      - INFLUXDB_ORG=my-org
      - INFLUXDB_TOKEN=my-super-token
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-token

  # Servicio de inicialización de datos
  data-sync-init:
    image: mongo:latest
    container_name: data-sync-init
    depends_on:
      - mongu
      - gestion-db
      - notification-db
      - documentacion-db
      - ia-db
      - influxdb
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    command: >
      bash -c "
        echo '🔄 Iniciando sincronización automática de datos...';
        apt-get update -qq && apt-get install -y netcat-traditional python3 python3-pip > /dev/null 2>&1;
        echo '📋 Herramientas instaladas...';
        chmod +x /scripts/simple_data_init.sh;
        chmod +x /scripts/load_csv_to_influx.py;
        /scripts/simple_data_init.sh;
        echo '🎉 Proceso de inicialización automática finalizado.';
      "
    restart: "no"

volumes:
  mongo_data:
  influxdb_data:
  notification_data:
  documentacion_data:
  gestion_data:
  gestion_firmas:  # Volumen para persistir firmas digitales
  ia_data:  # Volumen para base de datos de IA/ML
  pgdata1: