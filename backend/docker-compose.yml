services:
  apigateway:
    build: ./apigateway
    container_name: apigateway
    ports:
      - "3500:3500"
    # volumes:
    #   - ./apigateway:/app
  # Microservicio
  iot-service:
    build:
      context: ./microservicios/ParserService
      dockerfile: Dockerfile
    container_name: iot-service
    ports:
      - "8090:8090"
    # depends_on:
    #   - mongu
    #   - influxdb
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep :8090 | grep LISTEN || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Microservicio de Notificaciones
  notification-service:
    build:
      context: ./microservicios/notification
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8091:8091"
    depends_on:
      - notification-db
    env_file:
      - ./microservicios/notification/.env
    environment:
      - ENV=production

  # Microservicio de Gestión de Activos y Técnicos
  gestion-service:
    build:
      context: ./microservicios/gestion
      dockerfile: Dockerfile
    container_name: gestion-service
    ports:
      - "8092:8092"
    depends_on:
      - gestion-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Base de datos PostgreSQL para notificaciones
  notification-db:
    build:
      context: ./database/notification
      dockerfile: Dockerfile
    container_name: notification-db
    ports:
      - "5432:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=notification_user
      - POSTGRES_PASSWORD=notification_pass
      - POSTGRES_DB=notification_db

  # Base de datos PostgreSQL para gestión
  gestion-db:
    build:
      context: ./database/gestion
      dockerfile: Dockerfile
    container_name: gestion-db
    ports:
      - "5433:5432"
    volumes:
      - gestion_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gestion_user
      - POSTGRES_PASSWORD=gestion_pass
      - POSTGRES_DB=gestion_db

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # WebSocket MQTT
      - "8081:8081"    # Dashboard HTTP API
      - "18083:18083"  # EMQX Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_LOADED_PLUGINS=emqx_management,emqx_recon,emqx_retainer,emqx_dashboard,emqx_rule_engine,emqx_bridge_rabbitmq
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # middleware MQTT
  middleware_mqtt:
    build:
      context: ./middleware_MQTT_api
      dockerfile: Dockerfile
    container_name: middleware_mqtt
    depends_on:
      emqx:
        condition: service_healthy
      iot-service:
        condition: service_started
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensor/datos
    restart: on-failure

  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   ports:
  #     - "5672:5672"    # RabbitMQ protocolo AMQP
  #     - "15672:15672"  # RabbitMQ Dashboard
  #   environment:
  #     - RABBITMQ_DEFAULT_USER=admin
  #     - RABBITMQ_DEFAULT_PASS=admin
    
  mongu:
    image: mongo:latest
    container_name: mongu
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      - INFLUXDB_BUCKET=sensores
      - INFLUXDB_ORG=my-org
      - INFLUXDB_TOKEN=my-super-token
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-token

volumes:
  mongo_data:
  influxdb_data:
  notification_data:
  gestion_data:
