services:
  mongudb:
    image: mongo:latest
    container_name: mongudb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      - INFLUXDB_BUCKET=sensores
      - INFLUXDB_ORG=my-org
      - INFLUXDB_TOKEN=my-super-token
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-token
  api:
    build: ./cliente
    container_name: sensores_api
    ports:
      - "8000:8000"    
    depends_on:
      - mongudb
      - influxdb
    environment:
      - MONGO_URI=mongodb://mongudb:27017
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-super-token
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=sensores

volumes:
  mongo_data:
  influxdb_data:
