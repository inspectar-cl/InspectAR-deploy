# IA Service Python Configuration
# Configuración para Docker

# Server
app_name: "IA Service Python"
host: "0.0.0.0"
port: 8095
debug: false
log_level: "INFO"

# Database
database_host: "ia-db"
database_port: 5432
database_name: "ia_db"
database_user: "ia_user"
database_password: "ia_pass"

# External Services
ml_engine_url: "http://ml_engine_python:9999"
ml_engine_timeout: 300

iot_service_url: "http://iot-service:8090"
iot_service_timeout: 60

# Scheduler
scheduler_enabled: true
scheduler_interval_minutes: 2

# Data Window
window_size: 1000
window_page: 1
