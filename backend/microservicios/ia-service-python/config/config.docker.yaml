# IA Service Python Configuration
# Configuración para Docker

# Server
app_name: "IA Service Python"
host: "0.0.0.0"
port: 8095
debug: false
log_level: "INFO"

# Database
database_host: "ia-db"
database_port: 5432
database_name: "ia_db"
database_user: "ia_user"
database_password: "ia_pass"

# External Services
iot_service_url: "http://iot-service:8090"
iot_service_timeout: 60

# Scheduler
scheduler_enabled: true
scheduler_interval_minutes: 2

# Training Configuration
training_enabled: true
training_interval_minutes: 5  # Entrenar modelo cada 5 minutos

# Model Storage
model_dir: "/app/models"
model_filename: "anomaly_model.pkl"
scaler_x_filename: "scaler_X.pkl"
scaler_y_filename: "scaler_Y.pkl"

# Data Window
window_size: 5000
window_page: 1
