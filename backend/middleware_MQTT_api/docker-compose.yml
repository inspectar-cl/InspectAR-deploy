version: "3.8"

services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      - EMQX_ALLOW_ANONYMOUS=true

  microservicio:
    build:
      context: .
      dockerfile: dockerfile
    container_name: middleware_mqtt_api
    depends_on:
      - emqx
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_TOPIC=sensor/datos
      - TARGET_MICROSERVICE_URL=http://nombre_del_microservicio:puerto/endpoint

