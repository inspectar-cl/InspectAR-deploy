## Configuración general del broker
node.name = emqx@127.0.0.1
node.cookie = emqxsecretcookie

## Puerto de escucha MQTT
listener.tcp.default = 1883

## Puerto para MQTT sobre WebSocket
listener.ws.default = 8083

## Configuración de autenticación (por defecto: anónima permitida)
allow_anonymous = true

## Plugins habilitados
# Dashboard web para administración
dashboard.listener.http = 18083

# Plugin de gestión
management.listener.http = 8081

# Plugin de autenticación simple (opcional)
# auth.user.admin.password = admin

## Límite de conexiones
max_connections = 102400

## Límite de tamaño de mensaje
max_packet_size = 1MB

## Logs
log.console = console
log.console.level = info